<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知镜 · 两边的原话，和评论区的反驳</title>
<meta name="description" content="输入你正在纠结的选择，知镜把知乎上两边的真人原话并排摆出来，评论区里有人当场不同意的，也一起摆出来。每句都能核对，都署名答主。">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="brand">知镜<span class="dot">.</span></p>
    <h1>高赞回答，不一定适用于你。</h1>
    <p class="lede">输入你在纠结的选择，把知乎上两边的真人原话并排摆出来——评论区里有人当场不同意的，也一起摆出来。</p>
    <form id="ask-form" class="ask" role="search" novalidate>
      <label for="q" class="sr-only">你在纠结什么</label>
      <input id="q" name="q" type="search" maxlength="80" autocomplete="off" enterkeyhint="search" placeholder="你在纠结什么？比如：考研还是直接工作">
      <button id="ask-btn" class="btn big" type="submit">对比两边</button>
    </form>
    <p id="ask-note" class="note" aria-live="polite"></p>
    <div class="examples">
      <span class="note">试试：</span>
      <div id="examples" class="chips" role="group" aria-label="示例问题"></div>
    </div>
  </header>
  <div id="error-slot" role="alert"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="results" aria-label="结果" aria-busy="false">
    <div id="result-head"></div>
    <div id="compare"></div>
    <details id="sources" class="sources" hidden>
      <summary id="sources-summary"></summary>
      <div id="sources-note"></div>
      <div id="list-bar" class="list-bar"></div>
      <div id="list" class="list"></div>
    </details>
  </section>
  <details id="data-details" class="data-details" hidden>
    <summary>这些内容是怎么来的</summary>
    <div id="source-note"></div><div id="diag-slot"></div>
  </details>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>

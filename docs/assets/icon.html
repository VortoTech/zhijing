<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>知镜 icon</title>
<style>
/* 900×900 项目图标：左右两色对应页面里的两个选项，「镜」居中。生成：无头 Chrome --window-size=900,900 截图 */
html,body{margin:0;width:900px;height:900px;overflow:hidden;}
.icon{position:relative;width:900px;height:900px;display:grid;grid-template-columns:1fr 1fr;
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;}
.a{background:#2F6B5E;}
.b{background:#9A5516;}
.glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#FBFAF8;font-size:540px;font-weight:600;line-height:1;padding-bottom:30px;}
.dot{position:absolute;right:96px;bottom:128px;width:70px;height:70px;border-radius:50%;background:#FBFAF8;}
</style></head>
<body><div class="icon"><div class="a"></div><div class="b"></div><div class="glyph">镜</div><div class="dot"></div></div></body></html>

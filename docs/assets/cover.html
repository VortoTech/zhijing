<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>知镜 封面</title>
<style>
/* 1672×941 项目封面。右侧卡片里的原话来自离线示例的真实数据（程墨Morgan 91 赞回答及其评论）。
   生成：无头 Chrome --window-size=1672,941 截图 */
html,body{margin:0;width:1672px;height:941px;overflow:hidden;background:#FBFAF8;}
*{box-sizing:border-box;}
.cover{width:1672px;height:941px;padding:86px 92px;display:grid;grid-template-columns:1.02fr 1fr;gap:72px;align-items:center;
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;color:#1B1A17;}
.brand{font-size:40px;font-weight:650;letter-spacing:1px;margin:0 0 34px;}
.brand span{color:#2F6B5E;}
h1{font-size:82px;line-height:1.22;margin:0 0 30px;font-weight:700;letter-spacing:1px;}
.sub{font-size:31px;line-height:1.6;color:#5A574F;margin:0 0 38px;}
.points{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 30px;}
.points span{font-size:24px;padding:8px 18px;border-radius:999px;border:1.5px solid #CFCABE;color:#5A574F;background:#fff;}
.url{font-size:26px;color:#2F6B5E;font-weight:600;letter-spacing:.5px;}

.card{background:#fff;border:1.5px solid #E3E0D8;border-radius:22px;padding:38px 38px 34px;box-shadow:0 18px 40px rgba(27,26,23,.07);}
.q{font-size:30px;font-weight:700;margin:0 0 22px;line-height:1.4;}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px;}
.side{border-top:5px solid #2F6B5E;padding-top:12px;}
.side.b{border-top-color:#9A5516;}
.side h3{margin:0 0 6px;font-size:24px;}
.side h3 b{color:#2F6B5E;}
.side.b h3 b{color:#9A5516;}
.side p{margin:0;font-size:22px;color:#5A574F;}
.quote{margin:0;padding:16px 20px;background:#F5F4F1;border-left:5px solid #2F6B5E;border-radius:0 12px 12px 0;font-size:26px;line-height:1.6;}
.cap{font-size:19px;color:#69645B;margin:8px 0 16px;}
.push{margin-left:22px;padding:16px 20px;background:#FEF4E4;border-left:4px solid #DFA44A;border-radius:0 12px 12px 0;}
.push .h{font-size:21px;font-weight:700;color:#8A5A12;margin:0 0 8px;}
.push .t{font-size:26px;line-height:1.6;margin:0;}
.push .c{font-size:18px;color:#69645B;margin-top:6px;}
</style></head>
<body><div class="cover">
  <div>
    <p class="brand">知镜<span>.</span></p>
    <h1>高赞回答，<br>不一定适用于你。</h1>
    <p class="sub">把知乎上两边的真人原话并排摆出来——<br>评论区里有人当场不同意的，也一起摆出来。</p>
    <div class="points"><span>原话一字不改</span><span>每句都能核对</span><span>署名答主</span><span>不替你做决定</span></div>
    <div class="url">zhijing.vortotech.com</div>
  </div>
  <div class="card">
    <p class="q">第一份工作，选高薪小公司还是低薪大厂？</p>
    <div class="sides">
      <div class="side"><h3>选<b>高薪小公司</b></h3><p>薪资体现当下价值</p></div>
      <div class="side b"><h3>选<b>低薪大厂</b></h3><p>平台背书，简历值钱</p></div>
    </div>
    <p class="quote">你肯定应该选认可你更高价值的那一个雇主</p>
    <p class="cap">程墨Morgan · 91 赞 · 原话</p>
    <div class="push">
      <p class="h">评论区有读者当场补了前提</p>
      <p class="t">当然我这是社招，不是应届生。</p>
      <p class="c">读者评论原话</p>
    </div>
  </div>
</div></body></html>
